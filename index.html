  <!-- ========== v2.7: 主页手柄 (按键即导航) ==========

  <section class="console-wrap" id="console" aria-label="栏目手柄">

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <span class="modal-emoji" id="modalEmoji"></span>
        <h3 class="modal-title" id="modalTitle"></h3>
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ========== v3.0 反馈弹窗 (feedback) ==========
       字段: 名字或昵称(可选) / 与主页主人的关系 / 本条反馈针对的设备 / 反馈内容(必填)
       提交时间与网站版本由系统自动附带, 不要求访客填写。
       复用 v1 就有的 .modal-overlay / .modal 外壳, 只加内容, 不动原有设计。 -->
  <div class="modal-overlay" id="feedbackOverlay" hidden>
    <div class="modal feedback-modal" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
      <div class="modal-head">
        <span class="modal-emoji" aria-hidden="true">📮</span>
        <h3 class="modal-title" id="fbTitle"></h3>
        <button class="modal-close" id="fbClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <p class="fb-intro" id="fbIntro"></p>
        <form class="fb-form" id="fbForm" novalidate>
          <!-- 1. 名字或昵称(可选) -->
          <div class="fb-field">
            <label class="fb-label" for="fbNickname" id="fbNicknameLabel"></label>
            <input type="text" id="fbNickname" name="nickname" maxlength="40" autocomplete="nickname" />
            <p class="fb-hint" id="fbNicknameHint"></p>
          </div>

          <!-- 2. 与主页主人的关系 -->
          <fieldset class="fb-field fb-fieldset">
            <legend class="fb-label" id="fbRelationLabel"></legend>
            <div class="fb-options" id="fbRelation" role="radiogroup" aria-labelledby="fbRelationLabel"></div>
            <p class="fb-error" id="fbRelationError" hidden></p>
          </fieldset>

          <!-- 3. 本条反馈针对的设备 -->
          <fieldset class="fb-field fb-fieldset">
            <legend class="fb-label" id="fbDeviceLabel"></legend>
            <div class="fb-options" id="fbDevice" role="radiogroup" aria-labelledby="fbDeviceLabel"></div>
            <p class="fb-error" id="fbDeviceError" hidden></p>
          </fieldset>

          <!-- 4. 反馈内容(必填) -->
          <div class="fb-field">
            <label class="fb-label" for="fbContent" id="fbContentLabel"></label>
            <textarea id="fbContent" name="content" rows="5" maxlength="1000"></textarea>
            <div class="fb-meta">
              <p class="fb-hint" id="fbContentHint"></p>
              <span class="fb-count" id="fbCount"></span>
            </div>
            <p class="fb-error" id="fbContentError" hidden></p>
          </div>

          <!-- 5. 自动附带说明(提交时间 / 网站版本, 不用访客填) -->
          <p class="fb-auto" id="fbAuto"></p>

          <div class="fb-actions">
            <button class="fb-submit" id="fbSubmit" type="submit"></button>
            <button class="fb-cancel" id="fbCancel" type="button"></button>
          </div>
          <p class="fb-status" id="fbStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>

  <!-- ========== 我的分身 (v4.0: 真实大模型 + 知识库检索) ========== -->
  <div class="bot-widget" id="botWidget">

    </div>
  </div>

      <div class="chat-note">留言保存在本地浏览器 · 后续可接入 Supabase 后端</div>
    </div>

  <script src="js/persona.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/main.js"></script>
  <!-- v3.0 反馈: 后台用 Supabase。supabase-js 走 CDN, 加载失败会自动降级为本机暂存, 页面不受影响。
       js/config.js 放 Project URL / anon key, 该文件已在 .gitignore 中(不提交 Git);
       没有这个文件时控制台会有一条 404, 属正常, 站点照常运行。 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/feedback.js" defer></script>
